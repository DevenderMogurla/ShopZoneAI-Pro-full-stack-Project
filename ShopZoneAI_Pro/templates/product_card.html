
<div class="product-card"><a href="{{ url_for('product_detail',pid=p.id) }}"><img class="product-img" src="{{ url_for('static',filename=p.image if p.image else 'phone.svg') }}" onerror="this.src='{{ url_for('static',filename='phone.svg') }}'"></a><div class="p-3"><span class="badge badge-soft mb-2">{{ p.category }}</span><a class="text-decoration-none text-light" href="{{ url_for('product_detail',pid=p.id) }}"><h6 class="mb-2">{{ p.name }}</h6></a><div class="d-flex align-items-center gap-2 mb-3"><span class="price">₹{{ '%.2f'|format(p.price) }}</span>{% if p.compare_price and p.compare_price>p.price %}<small class="strike">₹{{ '%.0f'|format(p.compare_price) }}</small>{% endif %}</div><form method="post" action="{{ url_for('cart_add',pid=p.id) }}"><button class="btn btn-primary btn-sm w-100" {% if p.stock<1 %}disabled{% endif %}>{{ 'Add to cart' if p.stock else 'Out of stock' }}</button></form></div></div>
