
{% extends 'admin/base_admin.html' %}{% block admin_content %}<div class="eyebrow">Catalog editor</div><h1 class="h2 mb-4">{{ 'Edit product' if p else 'Add a new product' }}</h1><form method="post" enctype="multipart/form-data" class="panel p-4"><div class="row g-3"><div class="col-md-8"><label class="form-label">Product name</label><input class="form-control" name="name" value="{{ p.name if p else '' }}" required></div><div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ p.category if p else '' }}" placeholder="Electronics" required></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="4">{{ p.description if p else '' }}</textarea></div><div class="col-md-4"><label class="form-label">Selling price (₹)</label><input class="form-control" type="number" step=".01" min="0" name="price" value="{{ p.price if p else '' }}" required></div><div class="col-md-4"><label class="form-label">MRP / compare price (₹)</label><input class="form-control" type="number" step=".01" min="0" name="compare_price" value="{{ p.compare_price if p else '' }}"></div><div class="col-md-4"><label class="form-label">Stock quantity</label><input class="form-control" type="number" min="0" name="stock" value="{{ p.stock if p else 0 }}" required></div><div class="col-12"><label class="form-label">Product image (JPG, PNG, WEBP, GIF; max 5MB)</label><input class="form-control" type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif">{% if p and p.image %}<small class="muted">Current image: {{ p.image }}</small>{% endif %}</div><div class="col-12 d-flex gap-4"><label><input type="checkbox" name="featured" {% if p and p.featured %}checked{% endif %}> Featured product</label><label><input type="checkbox" name="active" {% if not p or p.active %}checked{% endif %}> Published / visible</label></div></div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save product</button><a class="btn btn-outline-light" href="{{ url_for('admin_products') }}">Cancel</a></div></form>{% endblock %}
